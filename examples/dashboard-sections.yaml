# Add this view to a dashboard. Each card belongs directly to the Sections grid.
# Requires both integrations. Existing horizontal-stack examples also work.
title: Documents
path: documents
type: sections
max_columns: 1
sections:
  - type: grid
    cards:
      - type: custom:escl-scan-card
        title: Scan
        duplex: false
        grid_options:
          columns: 6
          rows: auto
      - type: custom:ipp-print-upload-card
        title: Print
        # entity: sensor.office_current_job  # required with multiple printers
        grid_options:
          columns: 6
          rows: auto
