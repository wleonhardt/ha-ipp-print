[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Make `custom_components` importable regardless of invocation style
# (`pytest` console script doesn't put the repo root on sys.path).
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Ruff defaults (pyflakes + a pycodestyle subset); no import-sorting to keep
# the existing import style untouched.
select = ["E4", "E7", "E9", "F"]
